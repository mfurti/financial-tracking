name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: ledger_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ledger -d ledger_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ledger:test-only-password@127.0.0.1:5432/ledger_test
      TEST_DATABASE_URL: postgresql://ledger:test-only-password@127.0.0.1:5432/ledger_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter api exec prisma validate
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics-${{ github.sha }}-${{ github.event_name }}
          path: |
            test-results
            .local/analytics-*.png
            .local/settings-tiles-*.png
          retention-days: 3
          include-hidden-files: true
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPORT_VERIFIED_IMAGES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p .local
      - run: bash scripts/verify-operations.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: verified-images-${{ github.sha }}
          path: .local/verified-images/images.tar.gz
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
  publish:
    needs: [verify, operations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@v4
        with:
          name: verified-images-${{ github.sha }}
          path: .local/verified-images
      - run: gzip -dc .local/verified-images/images.tar.gz | docker load
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested images and create a deployment-only bundle
        shell: bash
        run: |
          bash scripts/publish-images.sh
          source .local/published-images.env
          node scripts/package-deployment.mjs --revision "$GITHUB_SHA" --output ".local/release/$GITHUB_SHA" --api "$API_IMAGE" --web "$WEB_IMAGE" --backup "$BACKUP_IMAGE"
          tar -czf ".local/financial-tracking-$GITHUB_SHA.tar.gz" -C ".local/release/$GITHUB_SHA" .
          printf '### Published tested image digests\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat .local/published-images.env >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: financial-tracking-deployment-${{ github.sha }}
          path: .local/financial-tracking-${{ github.sha }}.tar.gz
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
