packages:
  - apps/*
  - packages/*
allowBuilds:
  '@nestjs/core': false
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
  vue-demi: true
  embedded-postgres: true
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
minimumReleaseAgeExclude:
  - '@tanstack/charts@1.5.0'
