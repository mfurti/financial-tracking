name: household-ledger
services:
  postgres:
    image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_DB: ledger
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ledger -d ledger']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    image: ${API_IMAGE:?Set the API image digest from the deployment bundle}
    command: [migrate]
    environment: &api_environment
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_HOST: postgres
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set the private HTTPS origin}
      FINTS_PRODUCT_ID: ${FINTS_PRODUCT_ID:-}
      FINTS_BANK_URL: ${FINTS_BANK_URL:-}
    secrets: [db_password]
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    image: ${API_IMAGE:?Set the API image digest from the deployment bundle}
    restart: unless-stopped
    environment: *api_environment
    secrets: [db_password]
    networks:
      private:
        aliases: [ledger-api]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/v1/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
  web:
    image: ${WEB_IMAGE:?Set the web image digest from the deployment bundle}
    restart: unless-stopped
    environment:
      NUXT_API_INTERNAL_URL: http://ledger-api:3001
      NUXT_REQUIRE_TRUSTED_PROXY: 'true'
      NUXT_TRUSTED_PROXY_HOST: traefik
    networks:
      private:
      edge:
      lan:
        ipv4_address: ${LAN_IP:-192.168.178.33}
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik-public
      traefik.http.routers.household-ledger.rule: Host(`${APP_HOST:?Set the private hostname}`)
      traefik.http.routers.household-ledger.entrypoints: websecure
      traefik.http.routers.household-ledger.tls.certresolver: netcup
      traefik.http.routers.household-ledger.middlewares: secured@file,household-ledger-headers@docker
      traefik.http.services.household-ledger.loadbalancer.server.port: '3000'
      traefik.http.middlewares.household-ledger-headers.headers.contentTypeNosniff: 'true'
      traefik.http.middlewares.household-ledger-headers.headers.frameDeny: 'true'
      traefik.http.middlewares.household-ledger-headers.headers.referrerPolicy: no-referrer
      traefik.http.middlewares.household-ledger-headers.headers.contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
  backup:
    image: ${BACKUP_IMAGE:?Set the backup image digest from the deployment bundle}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ledger
      PGDATABASE: ledger
    secrets: [db_password, backup_recipients]
    volumes: ['${BACKUP_DIRECTORY:?Set the encrypted backup directory}:/backups']
    networks: [private]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/backup-success && test -z "$$(find /tmp/backup-success -mmin +1500 -print)"']
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 30s
networks:
  private:
  edge:
    external: true
    name: traefik-public
  lan:
    external: true
    name: FRITZBOX
volumes:
  postgres_data:
secrets:
  db_password:
    file: ${DB_PASSWORD_FILE:-./secrets/db_password}
  backup_recipients:
    file: ${BACKUP_RECIPIENTS_FILE:-./secrets/backup_recipients}
